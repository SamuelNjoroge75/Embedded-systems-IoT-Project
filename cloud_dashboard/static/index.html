<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busia Farm Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#eef2ee; --panel:#ffffff; --ink:#14231a; --muted:#5b6b60; --line:#cfd8d0;
          --accent:#1a6fb0; --warn:#b42318; --warnbg:#fde8e6; --ok:#1f7a45; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; }
  h1 { font-size:1.5rem; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:.9rem; }
  .status { font-weight:600; font-size:.9rem; }
  .status.on { color:var(--ok); } .status.off { color:var(--warn); }
  #alerts { margin:16px 0 0; }
  .alert { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn);
           padding:10px 14px; font-weight:600; margin-bottom:8px; }
  .readings { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
              margin:20px 0; border-top:2px solid var(--ink); border-bottom:1px solid var(--line); background:var(--panel); }
  .reading { padding:14px 16px; border-right:1px solid var(--line); }
  .reading:last-child { border-right:0; }
  .reading .v { font-size:2rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .reading .u { font-size:.95rem; font-weight:400; color:var(--muted); margin-left:2px; }
  .reading .k { color:var(--muted); font-size:.9rem; }
  .reading.low .v { color:var(--warn); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .bar .grow { flex:1; }
  button, select { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--panel);
                   color:var(--ink); border-radius:4px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.dl { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:focus-visible, select:focus-visible { outline:3px solid #7fb3e0; outline-offset:2px; }
  .chart { background:var(--panel); border:1px solid var(--line); padding:12px; height:340px; }
  .empty { padding:40px 0; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Busia Farm Monitor</h1>
      <div class="sub">CNS &middot; <span id="updated">waiting for data</span></div>
    </div>
    <div><select id="node" aria-label="Farm node"></select> <span id="status" class="status"></span></div>
  </header>

  <div id="alerts" aria-live="polite"></div>
  <div id="readings" class="readings"></div>

  <div class="bar">
    <div id="metrics" role="group" aria-label="Metric"></div>
    <div class="grow"></div>
    <select id="range" aria-label="Time range">
      <option value="1">Last hour</option>
      <option value="24" selected>Last 24 hours</option>
      <option value="168">Last 7 days</option>
    </select>
    <button class="dl" id="csv">Download CSV</button>
  </div>
  <div class="chart"><canvas id="chart"></canvas></div>
</main>

<script>
const UNITS = { soil:"%", moist:"%", temp:"\u00B0C", hum:"%", rain:"mm", batt:"V" };
const unitOf = k => { k = k.toLowerCase(); for (const p in UNITS) if (k.includes(p)) return UNITS[p]; return ""; };
const label = k => k.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
const isSoil = k => /soil|moist/i.test(k);

let state = { node:null, metric:null, soilMin:30, chart:null, latest:{} };
const $ = id => document.getElementById(id);

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

async function refresh() {
  try {
    const j = await getJSON("/api/latest");
    state.soilMin = j.soil_min; state.latest = j.nodes;
    const names = Object.keys(j.nodes);
    const sel = $("node");
    if (names.join() !== [...sel.options].map(o => o.value).join()) {
      sel.innerHTML = ""; names.forEach(n => sel.add(new Option(n, n)));
    }
    if (!names.length) { $("readings").innerHTML = '<div class="empty">No readings yet. Start the device or simulator.</div>'; return; }
    if (!state.node || !names.includes(state.node)) state.node = names[0];
    sel.value = state.node;
    renderLatest();
    await renderChart();
  } catch (e) { $("updated").textContent = "server unreachable"; }
}

function renderLatest() {
  const n = state.latest[state.node]; if (!n) return;
  const st = $("status"); st.textContent = n.online ? "Online" : "Offline"; st.className = "status " + (n.online ? "on" : "off");
  $("updated").textContent = "updated " + new Date(n.ts * 1000).toLocaleTimeString();
  const box = $("alerts"); box.innerHTML = "";
  const msgs = n.alerts.map(a => a.message);
  if (!n.online) msgs.push("No data from " + state.node + " for over 2 minutes");
  msgs.forEach(m => { const d = document.createElement("div"); d.className = "alert"; d.textContent = m; box.appendChild(d); });
  const r = $("readings"); r.innerHTML = "";
  for (const [k, v] of Object.entries(n.data)) {
    const d = document.createElement("div");
    d.className = "reading" + (isSoil(k) && v < state.soilMin ? " low" : "");
    const val = document.createElement("div"); val.className = "v"; val.textContent = Number(v).toFixed(1);
    const u = document.createElement("span"); u.className = "u"; u.textContent = unitOf(k); val.appendChild(u);
    const key = document.createElement("div"); key.className = "k"; key.textContent = label(k);
    d.append(val, key); r.appendChild(d);
  }
  const m = $("metrics");
  const keys = Object.keys(n.data);
  if (m.dataset.keys !== keys.join()) {
    m.dataset.keys = keys.join(); m.innerHTML = "";
    if (!keys.includes(state.metric)) state.metric = keys.find(isSoil) || keys[0];
    keys.forEach(k => {
      const b = document.createElement("button"); b.textContent = label(k); b.dataset.k = k;
      b.onclick = () => { state.metric = k; syncButtons(); renderChart(); };
      m.appendChild(b); m.appendChild(document.createTextNode(" "));
    });
  }
  syncButtons();
}
const syncButtons = () => document.querySelectorAll("#metrics button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === state.metric));

async function renderChart() {
  if (!state.node || !state.metric) return;
  const rows = await getJSON(`/api/history?node=${encodeURIComponent(state.node)}&hours=${$("range").value}`);
  const pts = rows.filter(r => state.metric in r.data).map(r => ({ x: r.ts * 1000, y: r.data[state.metric] }));
  const sets = [{ label: label(state.metric) + " " + unitOf(state.metric), data: pts, borderColor: "#1a6fb0",
                  backgroundColor: "#1a6fb0", pointRadius: pts.length > 150 ? 0 : 2, borderWidth: 2, tension: .2 }];
  if (isSoil(state.metric) && pts.length)
    sets.push({ label: "Dry threshold", data: [{x:pts[0].x,y:state.soilMin},{x:pts[pts.length-1].x,y:state.soilMin}],
                borderColor: "#b42318", borderDash: [6,4], pointRadius: 0, borderWidth: 1.5 });
  if (!state.chart) {
    state.chart = new Chart($("chart"), { type: "line", data: { datasets: sets },
      options: { animation: false, maintainAspectRatio: false, parsing: false,
        scales: { x: { type: "linear", ticks: { callback: v => new Date(v).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}), maxTicksLimit: 8 } } },
        plugins: { legend: { position: "bottom" } } } });
  } else { state.chart.data.datasets = sets; state.chart.update(); }
}

$("node").onchange = e => { state.node = e.target.value; refresh(); };
$("range").onchange = renderChart;
$("csv").onclick = () => { location.href = "/api/export.csv?node=" + encodeURIComponent(state.node || ""); };
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
